const NP = META.prints.length, ROWS = META.rows;

const LET = 9;

const NXT = new Int8Array(LET).fill(-1), FADE = new Float32Array(LET), FADE_DUR = new Float32Array(LET);
let untilNext = 1.2, lastInked = CUR[0];

  if (!idle.length) return;

  for (let j = 0; j < n; j++) {

    let k; do { k = Math.floor(Math.random() * NP); } while (k === CUR[i] && NP > 1);
    NXT[i] = k; FADE[i] = 0; FADE_DUR[i] = (1.0 + Math.random() * 0.6) / Math.sqrt(pace);   // calm at rest, quicker while scrolling

const ROWS_PER_PX = META.rows / 1700;   // drag-atlas rows per strip pixel at its natural scale

/* ---------- load letterpress strips + ink-drag atlases ---------- */
const STRIP = new Array(NP), SMEAR = new Array(NP), DENSE = new Array(NP), READY = new Uint8Array(NP);
META.prints.forEach(p => { p.lh = Math.min(p.bh, Math.round(0.158 * p.bw)); });
// every print's letters are placed on the same reference spacing, so mixed prints line up

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* autoplay: pull open -> release -> recompose -> pull the composition -> back */

  [1.6, 0, 0, 0, 0], [3.6, 0, 0, 0, 1], [2.4, 0, 0, 1, 1], [2.6, 0, 0, 1, 0], [0.8, 0, 0, 0, 0],

const TL_TOTAL = TL.reduce((a, k) => a + k[0], 0);
function timeline(t) {
  t %= TL_TOTAL;
  for (const [d, z0, z1, s0, s1] of TL) {
    if (t < d) { const e = ease(t / d); return [lerp(z0, z1, e), lerp(s0, s1, e)]; }
    t -= d;

/* ---------- text blocks: corners for the word, slide positions for the composition ---------- */

      m2ctx.drawImage(sm, b0 + ins, 0, dw, ROWS, 0, 0, dw, MIXH);
      m2ctx.globalCompositeOperation = 'destination-in';
      m2ctx.drawImage(MASK[lvl], 0, 0, dw, MIXH, 0, 0, dw, MIXH);
      mctx.setTransform(1, 0, 0, 1, 0, 0);
      mctx.globalCompositeOperation = 'source-over'; mctx.globalAlpha = 1;
      mctx.drawImage(DENSE[k], b0 + ins, 0, dw, ROWS, 0, 0, dw, MIXH);
      mctx.drawImage(mix2, 0, 0, dw, MIXH, 0, 0, dw, MIXH);
      g.drawImage(mix, 0, 0, dw, MIXH, x0 - hs + ins, uTop, dw, L);
    }
    g.restore();
  }
  // the two halves, each running a device pixel or two into the drag so the joins are closed
  const e = Math.max(0.6, 1.6 / (DPR * kk));
  g.drawImage(img, b0, top, sw, CUT - top + e, x0 - hs, uTop - (CUT - top), sw, CUT - top + e);
  g.drawImage(img, b0, CUT - e, sw, bot - CUT + e, x0 + hs, uBot - e, sw, bot - CUT + e);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = alpha;
  ctx.drawImage(layer, 0, 0, bw, bh, bx0, by0, bw, bh);
}

/* ---------- dashed line across the page, through the middle of the word ---------- */
const smoothPull = { v: 0 };
function drawDashes(dt) {
  agit *= Math.pow(0.45, dt);                                     // settles back to even spacing
  smoothPull.v += (s - smoothPull.v) * Math.min(1, dt * 6);
  const pull = smoothPull.v;
  tau += dt * (0.15 + 1.6 * pull);
  const e = ease(z);
  const fs0 = 0.021 * H;                                          // size of the small titles
  const th0 = Math.max(1.6, fs0 * 0.105), th1 = 0.026 * H;        // stroke of the titles -> legible prints
  const th = Math.exp(lerp(Math.log(th0), Math.log(th1), e));
  const dl = th * DASH_ASP, g0 = dl * 0.55;
  const reveal = smooth(3.5, 10, th);                             // solid dash -> letterpress impression
  const amp = Math.min(1.6, agit * 1.1 + pull * 1.25);            // pulling makes the gaps far more unsettled
  const near = mouse.x !== null ? mouse.x : W / 2, R = W * 0.28;
  const yMid = H / 2, curve = pull * 0.022 * H;                   // small vertical waves while pulling
  const yAt = x => yMid + curve * (0.62 * Math.sin(x / W * 6.283 * 1.3 + tau * 1.7) + 0.38 * Math.sin(x / W * 6.283 * 3.1 - tau * 2.3));

  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = '#3F4190';
  let x = 0, i = 0;
  while (x < W && i < GAPS) {
    const cx = x + dl / 2, cy = yAt(cx);
    const slope = (yAt(cx + 4) - yAt(cx - 4)) / 8;
    ctx.setTransform(DPR, 0, 0, DPR, DPR * cx, DPR * cy);
    if (slope) ctx.rotate(Math.atan(slope));
    if (reveal < 1) { ctx.globalAlpha = 1 - reveal; ctx.fillRect(-dl / 2, -th / 2, dl, th); }
    const k = DASH_PRINT[i] % NP;
    if (reveal > 0 && THUMB[k]) { ctx.globalAlpha = reveal; ctx.drawImage(THUMB[k], -dl / 2, -th / 2, dl, th); }
    // the gap after this dash: equal at rest, uneven and restless when stirred
    const w = mouse.x !== null ? 0.35 + 0.65 * Math.exp(-(((cx - near) / R) ** 2)) : 0.6;
    const n = 0.62 * Math.sin(tau * GF1[i] + GP1[i]) + 0.38 * Math.sin(tau * GF2[i] + GP2[i]);
    const gap = g0 * Math.max(0.06, 1 + amp * w * 1.35 * n);
    x += dl + gap; i++;
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ---------- frame ---------- */
let last = performance.now(), zSpeed = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  let sGoal;
  if (auto) { autoT += dt; [zT, sGoal] = timeline(autoT); }
  const zp = z, sp = s;
  z += (zT - z) * Math.min(1, dt * (auto ? 12 : 5)); if (Math.abs(zT - z) < 1e-4) z = zT;
  if (!auto) {
    // scrolling: the letters are pulled open on the way between the word and the composition,
    // and closed again at either end; a hand drag can pull further
    kick *= Math.pow(0.08, dt);
    const between = 0.92 * Math.pow(Math.sin(Math.PI * z), 0.8);
    sGoal = clamp(Math.max(sT, between + kick), 0, 1);
  }
  s += (sGoal - s) * Math.min(1, dt * (auto ? 12 : 7)); if (Math.abs(sGoal - s) < 1e-4) s = sGoal;

  // re-inking: now and then one or two letters, chosen at random, slowly take another print.
  // scrolling and pulling make it happen a little more often, never all at once
  // scroll speed (word <-> composition per second), smoothed
  zSpeed += (Math.abs(z - zp) / Math.max(dt, 1e-3) - zSpeed) * Math.min(1, dt * 6);
  const pace = 1 + zSpeed * 6 + Math.abs(s - sp) / Math.max(dt, 1e-3) * 2;   // 1 at rest
  untilNext -= dt * pace;
  let guard = 0;
  while (untilNext <= 0 && guard++ < 4) { reink(pace); untilNext += 1.05 + Math.random() * 0.9; }
  for (let i = 0; i < LET; i++) if (NXT[i] >= 0) {
    FADE[i] += dt / FADE_DUR[i];
    if (FADE[i] >= 1) { CUR[i] = NXT[i]; NXT[i] = -1; FADE[i] = 0; }
  }
  wave *= Math.pow(0.3, dt);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'multiply';
  ctx.imageSmoothingQuality = 'high';

  const kw = Math.min(W * 0.92 / REF_BW, H * 0.36 / REF_BH);          // word scale (screen px per normalised px)
  const hWord = REF_BH * kw;
  const Dmax = H / 2 - hWord / 2 + 0.36 * hWord / 2;                   // halves cut by the page edges
  const aspAdj = Math.pow(clamp(W / H / 1.42, 0.8, 1.3), 0.4);
  const tiltT = mouse.x !== null ? (mouse.x - W / 2) / (W / 2) * 0.22 : 0;
  shear += (tiltT - shear) * Math.min(1, dt * 3);               // the mouse tips every drag left or right

  for (let i = 0; i < LET; i++) {
    // the print this letter is wearing; while re-inking, the new impression slowly comes up over the old
    const k0 = CUR[i], k1 = NXT[i] >= 0 ? NXT[i] : CUR[i], fr = NXT[i] >= 0 ? FADE[i] : 0;
    const a1 = NXT[i] >= 0 ? ease(smooth(0, 0.62, fr)) : 0, a0 = 1 - ease(smooth(0.38, 1, fr));

    const zi = ease(smooth(DELAY[i], DELAY[i] + 0.68, z));
    const C = COMP[i];
    const kc = C[2] * H * aspAdj / REF_BH;
    const kn = Math.exp(lerp(Math.log(kw), Math.log(kc), zi));   // screen px per normalised px
    const D = s * Dmax * lerp(1, 0.55, zi);
    const rot = ROT[i] * Math.sin(Math.PI * zi);
    const arc = ARC[i] * Math.sin(Math.PI * zi);
    const lean = clamp(LEAN[i] + shear, -0.45, 0.45) * D;
    for (const [k, a] of (NXT[i] >= 0 ? [[k0, a0], [k1, a1]] : [[k0, 1]])) {
      const kk2 = READY[k] ? k : 0, P = META.prints[kk2];
      const norm = REF_BW / P.bw, kk = kn * norm;                   // every print shown at the same word width
      const wx = W / 2 + (REFC[i] - 0.5) * REF_BW * kw, wy = H / 2;
      const X = lerp(wx, C[0] * W, zi) + arc * H, Y = lerp(wy, C[1] * H, zi) - arc * W * 0.3;
      drawLetter(kk2, i, a, X, Y, kk, rot, D, lean);
    }
  }
  drawDashes(dt);
  placeText(ease(z));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__set = (zz, ss) => { setAuto(false); z = zT = zz; s = sT = ss; kick = 0; };
window.__wheel = (dy) => dispatchEvent(new WheelEvent('wheel', { deltaY: dy, cancelable: true }));
</script>
</body>
</html>
